name: PrehrajTo
options:
  bundleIdPrefix: sk.prehrajto.native
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: PrehrajTo/Info.plist
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PrehrajTo:
    type: application
    platform: iOS
    sources:
      - path: PrehrajTo
        excludes:
          - "Tests/**"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.prehrajto.native.app
        INFOPLIST_FILE: PrehrajTo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    frameworks:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: Security.framework

  PrehrajToTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrehrajTo/Tests
    dependencies:
      - target: PrehrajTo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.prehrajto.native.tests
        GENERATE_INFOPLIST_FILE: YES
